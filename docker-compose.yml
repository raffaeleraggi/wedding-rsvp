services:
  backend:
    build:
      context: ./backend
    container_name: wedding-rsvp-backend
    ports:
      - "8080:8080"
    environment:
      FRONTEND_BASE_URL: http://localhost:5173
      SQLITE_DB_PATH: /data/wedding-rsvp.db
      WHATSAPP_ENABLED: "false"
    volumes:
      - wedding_sqlite_data:/data

  frontend:
    build:
      context: ./frontend
    container_name: wedding-rsvp-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  wedding_sqlite_data:
